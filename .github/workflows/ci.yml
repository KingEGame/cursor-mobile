# Same release gate as the PC pre-push hook, on a clean checkout.
# gate → android-apk → release (tags v*).
name: CI

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  gate:
    name: gate (build + all tests)
    # node1 is a private self-hosted runner: never run fork PRs on it.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, node1]
    timeout-minutes: 25
    outputs:
      tests-passed: ${{ steps.gate.outputs.tests-passed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - id: gate
        name: Release gate
        env:
          GATE_CI: "1"
        run: |
          bash scripts/release-gate.sh
          echo "tests-passed=$(cat .gate/tests-passed)" >> "$GITHUB_OUTPUT"
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gate-log
          path: .gate/last-run.log

  android-apk:
    name: android-apk (signed release)
    needs: gate
    runs-on: [self-hosted, node1]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # JDK 17 + Android SDK live on node1 under /home/acewar/ci (user-level
      # install: the runner account has no root, so they are exported here
      # instead of the runner .env). ~/.gradle persists between runs.
      - name: "Toolchain (node1 JDK 17 + Android SDK)"
        run: |
          [ -d /home/acewar/ci/jdk17 ] || { echo "::error::JDK 17 not found at /home/acewar/ci/jdk17"; exit 1; }
          echo "JAVA_HOME=/home/acewar/ci/jdk17" >> "$GITHUB_ENV"
          echo "/home/acewar/ci/jdk17/bin" >> "$GITHUB_PATH"
          if [ -d /home/acewar/ci/android-sdk ] && [ -z "${ANDROID_HOME:-}" ]; then
            echo "ANDROID_HOME=/home/acewar/ci/android-sdk" >> "$GITHUB_ENV"
          fi
          java -version && echo "ANDROID_HOME=$ANDROID_HOME"
      - run: npm ci

      - name: Tag matches app version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          app="$(node -p "require('./apps/mobile/app.json').expo.version")"
          if [ "v$app" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} but apps/mobile/app.json version is $app"
            exit 1
          fi

      - name: Release keystore (optional secret)
        env:
          CM_KEYSTORE_BASE64: ${{ secrets.CM_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$CM_KEYSTORE_BASE64" ]; then
            echo "$CM_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "CM_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::No CM_KEYSTORE_BASE64 secret — APK is signed with the template debug key (matches the phone's current install)."
          fi

      - name: Build release APK
        working-directory: apps/mobile
        env:
          CM_KEYSTORE_PASSWORD: ${{ secrets.CM_KEYSTORE_PASSWORD }}
          CM_KEY_ALIAS: ${{ secrets.CM_KEY_ALIAS }}
          CM_KEY_PASSWORD: ${{ secrets.CM_KEY_PASSWORD }}
        run: |
          npx expo prebuild --platform android --no-install --clean
          cd android && ./gradlew --no-daemon assembleRelease

      - name: Verify built APK (cleartext, no installer permission, versionCode)
        run: |
          node scripts/verify-apk.mjs apps/mobile/android/app/build/outputs/apk/release/app-release.apk \
            --version-code "$(node scripts/version-code.mjs)"
          mkdir -p dist-apk
          v="$(node -p "require('./apps/mobile/app.json').expo.version")"
          cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk "dist-apk/hermes-phone-$v.apk"
          (cd dist-apk && sha256sum *.apk > SHA256SUMS)

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: dist-apk/
          retention-days: 30

  release:
    name: release (tag)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [gate, android-apk]
    runs-on: [self-hosted, node1]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: dist-apk
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist-apk/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --notes "Gate green · ${{ needs.gate.outputs.tests-passed }} tests · Hermes Phone APK (pairs with the Hermes Gateway phone bridge)."
