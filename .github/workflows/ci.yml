# Same release gate as the PC pre-push hook, on a clean checkout.
# gate → android-apk + hub-desktop-{linux,win,mac} → release (tags v*).
# Android + gate + linux/win Hub stay on node1 (self-hosted).
# macOS Hub builds use GitHub-hosted macos-latest (build only — never run Hub sync).
# Windows portable .exe is cross-built on node1 via electron-builder.# The phone never downloads from here directly: on the PC run
#   npm run publish:apk:github
# and the Hub serves that release over Tailscale (product lock: PC-local sync).
name: CI

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  gate:
    name: gate (build + all tests)
    runs-on: [self-hosted, node1]
    timeout-minutes: 25
    outputs:
      tests-passed: ${{ steps.gate.outputs.tests-passed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - id: gate
        name: Release gate
        env:
          GATE_CI: "1"
        run: |
          bash scripts/release-gate.sh
          echo "tests-passed=$(cat .gate/tests-passed)" >> "$GITHUB_OUTPUT"
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gate-log
          path: .gate/last-run.log

  android-apk:
    name: android-apk (signed release)
    needs: gate
    runs-on: [self-hosted, node1]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # JDK 17 + Android SDK come from node1 (runner .env); ~/.gradle persists between runs.
      - run: java -version && echo "ANDROID_HOME=$ANDROID_HOME"
      - run: npm ci

      - name: Tag matches app version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          app="$(node -p "require('./apps/mobile/app.json').expo.version")"
          if [ "v$app" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} but apps/mobile/app.json version is $app"
            exit 1
          fi

      - name: Release keystore (optional secret)
        env:
          CM_KEYSTORE_BASE64: ${{ secrets.CM_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$CM_KEYSTORE_BASE64" ]; then
            echo "$CM_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "CM_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::No CM_KEYSTORE_BASE64 secret — APK is signed with the template debug key (matches the phone's current install)."
          fi

      - name: Build release APK
        working-directory: apps/mobile
        env:
          CM_KEYSTORE_PASSWORD: ${{ secrets.CM_KEYSTORE_PASSWORD }}
          CM_KEY_ALIAS: ${{ secrets.CM_KEY_ALIAS }}
          CM_KEY_PASSWORD: ${{ secrets.CM_KEY_PASSWORD }}
        run: |
          npx expo prebuild --platform android --no-install --clean
          cd android && ./gradlew --no-daemon assembleRelease

      - name: Verify built APK (cleartext, install permission, versionCode)
        run: |
          code="$(node -e "import('./scripts/publish-apk-to-hub.mjs').then(m=>console.log(m.versionCodeFor(require('./apps/mobile/app.json').expo.version)))")"
          node scripts/verify-apk.mjs apps/mobile/android/app/build/outputs/apk/release/app-release.apk --version-code "$code"

      - name: Manifest for the Hub feed
        run: |
          node scripts/publish-apk-to-hub.mjs \
            --apk apps/mobile/android/app/build/outputs/apk/release/app-release.apk \
            --manifest-only --source github \
            --tests-passed "${{ needs.gate.outputs.tests-passed }}" \
            --ci-run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          mkdir -p dist-apk
          apk="$(node -p "require('./apps/mobile/android/app/build/outputs/apk/release/latest.json').apkFile")"
          cp "apps/mobile/android/app/build/outputs/apk/release/$apk" apps/mobile/android/app/build/outputs/apk/release/latest.json dist-apk/

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: dist-apk/
          retention-days: 30

  hub-desktop-linux:
    name: hub-desktop (linux AppImage)
    needs: gate
    runs-on: [self-hosted, node1]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Tag matches desktop version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          desk="$(node -p "require('./apps/desktop/package.json').version")"
          if [ "v$desk" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} but apps/desktop/package.json version is $desk"
            exit 1
          fi

      - name: Package Linux Hub desktop
        run: node scripts/package-desktop.mjs --platform linux

      - uses: actions/upload-artifact@v4
        with:
          name: hub-desktop-linux
          path: |
            dist-desktop/*.AppImage
            dist-desktop/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

  hub-desktop-win:
    name: hub-desktop (windows portable exe)
    needs: gate
    # Cross-build on node1 (Linux) — portable exe works via electron-builder without
    # a Windows runner, and avoids win32 npm.cmd spawn EINVAL under Actions.
    runs-on: [self-hosted, node1]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Tag matches desktop version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          desk="$(node -p "require('./apps/desktop/package.json').version")"
          if [ "v$desk" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} but apps/desktop/package.json version is $desk"
            exit 1
          fi

      - name: Package Windows Hub desktop
        run: node scripts/package-desktop.mjs --platform win

      - uses: actions/upload-artifact@v4
        with:
          name: hub-desktop-win
          path: |
            dist-desktop/*.exe
            dist-desktop/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

  hub-desktop-mac:
    name: hub-desktop (macOS zip)
    needs: gate
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Tag matches desktop version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          desk="$(node -p "require('./apps/desktop/package.json').version")"
          if [ "v$desk" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} but apps/desktop/package.json version is $desk"
            exit 1
          fi

      - name: Package macOS Hub desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: node scripts/package-desktop.mjs --platform mac

      - uses: actions/upload-artifact@v4
        with:
          name: hub-desktop-mac
          path: |
            dist-desktop/*.zip
            dist-desktop/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

  release:
    name: release (tag)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [gate, android-apk, hub-desktop-linux, hub-desktop-win, hub-desktop-mac]
    runs-on: [self-hosted, node1]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: dist-apk
      - uses: actions/download-artifact@v4
        with:
          name: hub-desktop-linux
          path: dist-desktop
      - uses: actions/download-artifact@v4
        with:
          name: hub-desktop-win
          path: dist-desktop
      - uses: actions/download-artifact@v4
        with:
          name: hub-desktop-mac
          path: dist-desktop
      - name: Combined SHA256SUMS
        run: |
          node --input-type=module -e '
            import { writeSha256Sums, listReleaseArtifacts } from "./scripts/package-desktop.mjs";
            const files = listReleaseArtifacts("dist-desktop");
            if (files.length < 3) {
              console.error("expected linux+win+mac artifacts, got", files);
              process.exit(1);
            }
            await writeSha256Sums("dist-desktop", files);
            console.log("SHA256SUMS for", files.join(", "));
          '
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist-apk/* dist-desktop/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --notes "Gate green · ${{ needs.gate.outputs.tests-passed }} tests · APK + latest.json (phone via PC Hub) · Hub desktop: Linux AppImage, Windows portable .exe, macOS zip (x64+arm64). Unsigned desktop binaries in v1."
