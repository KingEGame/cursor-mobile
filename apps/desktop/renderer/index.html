<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' http://127.0.0.1:* http://localhost:*" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cursor Mobile Hub</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main>
      <header>
        <h1>Cursor Mobile Hub</h1>
        <p class="sub">PC-local only · Tailscale + pair · CDP on 127.0.0.1</p>
      </header>

      <section class="card" aria-live="polite">
        <div class="row">
          <span class="label">Hub</span>
          <span id="hubState" class="value">Starting…</span>
        </div>
        <div class="row">
          <span class="label">Listen</span>
          <span id="listen" class="value mono">—</span>
        </div>
        <div class="row">
          <span class="label">Tailscale</span>
          <span id="tailscale" class="value mono">—</span>
        </div>
        <div class="row">
          <span class="label">CDP</span>
          <span id="cdp" class="value mono">—</span>
        </div>
        <div class="row">
          <span class="label">Workspace</span>
          <span id="workspace" class="value mono">—</span>
        </div>
        <div class="row">
          <span class="label">Live adapter</span>
          <span id="live" class="value">—</span>
        </div>
        <p id="error" class="error" hidden></p>
      </section>

      <section class="actions">
        <button type="button" id="btnPair">Open pair QR</button>
        <button type="button" id="btnHealth" class="secondary">Open /health</button>
        <button type="button" id="btnRefresh" class="secondary">Refresh</button>
      </section>

      <section class="card" aria-live="polite">
        <div class="row">
          <span class="label">Version</span>
          <span id="version" class="value mono">—</span>
        </div>
        <div class="row">
          <span class="label">Update</span>
          <span id="updateState" class="value">—</span>
        </div>
        <div class="actions" style="margin-top:10px">
          <button type="button" id="btnUpdate" class="secondary">Check for updates</button>
          <button type="button" id="btnFirewall" class="secondary" hidden>Allow phone access (firewall)</button>
        </div>
      </section>

      <section class="card">
        <div class="row">
          <span class="label" data-i18n="startup">Start with system</span>
          <label class="value"><input type="checkbox" id="autostart" /></label>
        </div>
        <div class="actions" style="margin-top:10px">
          <button type="button" id="btnDiag" class="secondary" data-i18n="diag">Why can't my phone connect?</button>
          <button type="button" id="btnLogs" class="secondary" data-i18n="logs">Open log folder</button>
        </div>
        <ul id="diagList" class="diag" hidden></ul>
      </section>

      <p class="hint">
        On the phone: join the same Tailscale mesh, install the companion APK, then Scan QR.
        The phone never dials CDP.
      </p>
    </main>
    <script src="./app.js"></script>
  </body>
</html>
